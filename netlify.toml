[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # WooCommerce shop for checkout, price and stock (docs/woocommerce-koppeling.md).
  # At launch WordPress moves to www.flavory.wine: change this URL AND ORIGIN in netlify/functions/woo-proxy.mts (docs/lancering.md).
  PUBLIC_WOO_URL = "https://www.flavory.wine"
  PUBLIC_CHECKOUT_PROVIDER = "woocommerce"

# PostHog (EU) through our own domain, so ad blockers and tracking protection miss fewer events.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

# /woo-api/*, /wp-json/* and /wc-api/* are handled by netlify/functions/woo-proxy.mts (WordPress on www).

# Security headers (audit action 2.5). CSP starts report-only.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://www.clarity.ms https://static.runconverge.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Deploy previews and branch deploys must never be indexed.
[context.deploy-preview.environment]
  PUBLIC_NOINDEX = "true"

[context.branch-deploy.environment]
  PUBLIC_NOINDEX = "true"
