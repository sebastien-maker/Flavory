[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # WooCommerce shop for checkout, price and stock (docs/woocommerce-koppeling.md).
  # After WordPress moves to shop.flavory.wine: change this URL AND the /woo-api/* proxy below.
  PUBLIC_WOO_URL = "https://flavory.wine"
  PUBLIC_CHECKOUT_PROVIDER = "woocommerce"

# Same-origin proxy to the WooCommerce Store API (read-only price and stock refresh in the browser).
[[redirects]]
  from = "/woo-api/*"
  to = "https://flavory.wine/wp-json/wc/store/v1/:splat"
  status = 200

# Security headers (audit action 2.5). CSP starts report-only.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://www.clarity.ms; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Deploy previews and branch deploys must never be indexed.
[context.deploy-preview.environment]
  PUBLIC_NOINDEX = "true"

[context.branch-deploy.environment]
  PUBLIC_NOINDEX = "true"
