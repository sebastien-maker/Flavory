name: "Bart Claessens"
role: "Oprichter en het creatieve brein achter Flavory"
bio: "Interesse voor wijn had Bart altijd, maar hij miste een laagdrempelige manier om er meer over te leren. Liefst een beetje leuk, en met een competitief randje. Toen hij dat nergens vond, ontwikkelde hij Flavory zelf. Hij organiseert geregeld wijnproefavonden en schrijft over wijn voor wie niet van vaktermen houdt."
