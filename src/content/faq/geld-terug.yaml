question: "Hebben jullie een niet-tevreden-geld-terug-garantie?"
answer: "Ja, Flavory werkt zonder risico. Ben je toch niet tevreden? Neem dan contact op met onze klantendienst via [info@flavory.wine](mailto:info@flavory.wine). We horen graag waarom, zodat we kunnen bijleren, en storten je aankoopbedrag terug."
