question: "Hoe werkt het wijnspel?"
answer: "1. Nodig vrienden uit: speel met 2 tot 6 personen en zet voor iedereen twee glazen klaar.
2. Schenk de wijnen: de flessen zitten in stoffen zakjes, dus niemand weet welke wijn in fles A en welke in fles B zit.
3. Kijk, ruik, proef: de sommelier van dienst leidt het proeven.
4. Speel en verzamel tips: de spelleider stelt quizvragen, elk juist antwoord levert punten en een extra tip op.
5. Ontmasker de wijnen: noteer je gok op het proefformulier.
6. Feliciteer de winnaar: tel de punten en kroon de wijnkenner van de avond.

Meer uitleg vind je op [hoe werkt het](/hoe-werkt-het/)."
group: spel
order: 5
