question: "Hoe werkt het wijnspel?"
answer: "1. Nodig je vrienden uit en schenk elke speler twee glazen wijn uit de anonieme flessen.\n2. Ruik, proef en noteer je bevindingen: herken je fruit, bloemen, kruiden of hout?\n3. Verzamel tips met quizvragen en ontmasker de twee wijnen.\n4. Tel de punten en kroon de winnaar.\n\nMeer uitleg vind je op [hoe werkt het](/hoe-werkt-het/)."
group: spel
order: 5
