question: "Wat is de levertijd?"
answer: "Bestellingen in België en Nederland worden meestal binnen 1 à 3 werkdagen geleverd. Je ontvangt altijd een verzendbevestiging met een trackingnummer zodra je bestelling onderweg is. Meer info op [verzending en retour](/verzending-en-retour/)."
