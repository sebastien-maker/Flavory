question: "Wat is de levertijd?"
answer: "Bestellingen voor België en Nederland worden doorgaans binnen 1 tot 3 werkdagen bezorgd. Je ontvangt altijd een verzendbevestiging met een trackingnummer zodra je bestelling onderweg is. Meer info op [verzending en retour](/verzending-en-retour/)."
