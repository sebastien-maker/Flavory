question: "Kan ik het spel opnieuw spelen?"
answer: "Flavory is een belevingsbox: één avond, twee blinde wijnen, één quiz, één winnaar. Daarna ken je de antwoorden, dus elke box speel je één keer. Wil je opnieuw spelen, kies dan een ander duel: elke box heeft andere wijnen en andere vragen."
