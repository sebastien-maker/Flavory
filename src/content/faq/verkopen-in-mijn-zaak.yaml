question: "Ik wil Flavory verkopen in mijn zaak. Kan dat?"
answer: "Graag. We werken samen met wijnhandelaars, drankenhandels en bedrijven, met onze wijnen of met jouw eigen selectie. Mail ons via [info@flavory.wine](mailto:info@flavory.wine), dan nemen we snel contact op."
