question: "Wat zit er in een Flavory-box?"
answer: "Elke box bevat een compleet wijnproefspel voor 2 tot 6 personen, professionele proefformulieren, een duidelijke handleiding, infobrochures vol wijntips en een mini-foodpairinggids. De wijnboxen bevatten daarnaast twee anoniem verpakte flessen wijn. De spelboxen zonder wijn (€24,90) bevatten twee stoffen zakjes, zodat je zelf gekochte flessen anoniem maakt."
