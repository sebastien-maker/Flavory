question: "Welke Flavory-box moet ik kiezen?"
answer: "Dat hangt af van wat je wilt: zelf spelen met vrienden of iemand verrassen met een wijncadeau. Kies eerst je stijl.\n\n- **Rood:** [Italië of Spanje](/shop/italie-of-spanje/) (landen vergelijken, onze bestseller, met wijn) of [Merlot of Cabernet Sauvignon](/shop/wijnproeverij-thuis-rood/) (zonder wijn).\n- **Wit:** [Chardonnay of Sauvignon Blanc](/shop/wijnproeverij-thuis-wit/), de basis van de witte wijn.\n- **Bubbels:** [cava of prosecco](/shop/bubbelbox/). Na deze proeverij haal je ze niet meer door elkaar.\n\nTwijfel je? Start met Italië of Spanje: dat is onze populairste instapper."
