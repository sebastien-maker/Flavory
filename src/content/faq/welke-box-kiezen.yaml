question: "Welke Flavory-box moet ik kiezen?"
answer: "Kies eerst je kleur. In elke box zitten het spel en twee flessen wijn.\n\n- **Rood:** in het [rode wijnspel](/shop/wijnproeverij-thuis-rood/) kies je Merlot vs Cabernet Sauvignon (twee iconische druiven) of Italië vs Spanje (twee wijnlanden, onze bestseller).\n- **Wit:** in het [witte wijnspel](/shop/wijnproeverij-thuis-wit/) proef je Chardonnay vs Sauvignon Blanc, de basis van de witte wijn.\n\nDaarna kies je Regular of Premium. Het spel is identiek, bij Premium krijg je twee duurdere flessen met nog meer diepgang."
