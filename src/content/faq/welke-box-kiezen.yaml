question: "Welke Flavory-box moet ik kiezen?"
answer: "Kies eerst je kleur. In elke box zitten het spel en twee flessen wijn.\n\n- **Rood:** in het [rode wijnspel](/shop/wijnproeverij-thuis-rood/) proef je Italië vs Spanje: twee wijnlanden, onze bestseller.\n- **Wit:** in het [witte wijnspel](/shop/wijnproeverij-thuis-wit/) proef je Chardonnay vs Sauvignon Blanc, de basis van de witte wijn."
