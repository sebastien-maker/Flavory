question: "Welke Flavory-box moet ik kiezen?"
answer: "Kies eerst je kleur. In elke box zitten het wijnspel en twee flessen wijn (75 cl), in Standaard of in Premium.

- **Rood:** in het [rode wijnspel](/shop/wijnproeverij-thuis-rood/) proef je Merlot of Cabernet Sauvignon.
- **Wit:** in het [witte wijnspel](/shop/wijnproeverij-thuis-wit/) proef je Chardonnay of Sauvignon Blanc.

Zolang de voorraad strekt is er ook nog Italië of Spanje, met een Italiaanse en een Spaanse rode wijn."
