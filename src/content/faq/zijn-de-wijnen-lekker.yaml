question: "Zijn de wijnen lekker?"
answer: "Ja. We kiezen alleen wijnen waar we zelf achter staan. Bij de druivenduels (Merlot vs Cabernet Sauvignon, Chardonnay vs Sauvignon Blanc) ligt de klemtoon op typische stijlverschillen: wijnen die het karakter van de druif duidelijk laten proeven. Lekker, maar vooral ook leerrijk. Zoek je nog meer diepgang, kies dan Premium."
