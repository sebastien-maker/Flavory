question: "Zijn de wijnen lekker?"
answer: "Ja. We kiezen alleen wijnen waar we zelf achter staan. Bij de druivenboxen (Merlot of Cabernet, Chardonnay of Sauvignon Blanc) ligt de klemtoon op typische stijlverschillen: wijnen die het karakter van de druif duidelijk laten proeven. Lekker, maar vooral ook leerrijk. Zoek je vooral wow-kwaliteit, kies dan eerder een landenbox."
group: kiezen
order: 3
