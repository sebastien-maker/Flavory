question: "Zijn de wijnen lekker?"
answer: "Ja. We kiezen alleen wijnen waar we zelf achter staan. Bij de druivenduels (Merlot of Cabernet Sauvignon, Chardonnay of Sauvignon Blanc) ligt de klemtoon op typische stijlverschillen: wijnen die het karakter van de druif duidelijk laten proeven. Lekker, maar vooral ook leerzaam. Zoek je nog meer diepgang, kies dan Premium."
