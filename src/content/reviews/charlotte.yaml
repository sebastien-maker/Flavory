author: "Charlotte"
rating: 4
title: "Fantastische ervaring!"
body: "Zeer leuk! Het spel is echt fantastisch om te spelen. Heel duidelijk en informatief maar op een speelse manier. Ik vond de wijnen ook super lekker (wij hadden de box van de rode wijnen). Tweede box is al besteld en de derde staat op mijn lijstje! De tweede box voelde helemaal niet hetzelfde aan: het verloop is gelijkaardig, maar met een heel andere twist. Je kunt dus zeker meer boxen bestellen zonder dat het saai wordt!"
order: 2
