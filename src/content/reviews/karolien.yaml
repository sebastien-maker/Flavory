title: "Super ervaring"
body: "Heel erg tevreden! Zowel de box zelf als de communicatie achteraf. Ik mailde hen in verband met de box die ik ontvangen had, en ze hebben mij onmiddellijk geholpen. Heel vriendelijk, qua klantenservice super! Over de wijn zelf waren we ook heel tevreden ;)."
